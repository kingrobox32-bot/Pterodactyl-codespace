services:
  database:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: password123
    volumes:
      - db:/var/lib/mysql
    restart: always
  cache:
    image: redis:alpine
    restart: always
  panel:
    image: ghcr.io/pterodactyl/panel:latest
    environment:
      APP_URL: http://localhost
      APP_TIMEZONE: Asia/Jakarta
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: panel
      DB_USERNAME: pterodactyl
      DB_PASSWORD: password123
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_DRIVER: redis
      REDIS_HOST: cache
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - database
      - cache
    restart: always
volumes:
  db:
